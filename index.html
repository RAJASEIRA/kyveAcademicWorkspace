<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <meta name="description" content="A personal student operating system for studying, planning, and tracking academic progress." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AW</div>
        <div class="brand-text">
          <div class="brand-name">Academic Workspace</div>
          <div class="brand-sub">Personal Study OS</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Main navigation"></nav>

      <div class="sidebar-foot">
        <div class="overall-mini">
          <div class="overall-mini-top">
            <span>Learning progress</span>
            <span id="sideOverallPct">0%</span>
          </div>
          <div class="progress"><div class="progress-fill" id="sideOverallBar"></div></div>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title-wrap">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
          <span class="page-sub" id="pageSub">Welcome back</span>
        </div>

        <button class="searchbar-trigger" id="searchTrigger" aria-label="Open search">
          <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="searchbar-text">Search everything…</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>

        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="page"></main>
    </div>
  </div>

  <!-- ============ SEARCH OVERLAY ============ -->
  <div class="overlay" id="searchOverlay" hidden>
    <div class="overlay-card search-card">
      <div class="search-box">
        <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search courses, lessons, tasks…" autocomplete="off" spellcheck="false" />
        <kbd class="kbd">Esc</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- ============ LESSON READER OVERLAY ============ -->
  <div class="overlay reader-overlay" id="readerOverlay" hidden>
    <div class="reader" id="reader"></div>
  </div>

  <!-- ============ CONFIRM OVERLAY ============ -->
  <div class="overlay" id="confirmOverlay" hidden>
    <div class="overlay-card confirm-card">
      <div class="confirm-icon" id="confirmIcon">⚠️</div>
      <h3 id="confirmTitle">Are you sure?</h3>
      <p id="confirmText">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div class="toast-wrap" id="toasts"></div>

  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
